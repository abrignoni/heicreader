name: Release

# Pushing a tag like v0.1.0 builds the six wheels on one Linux runner (the helper is pure
# Go, so every platform is cross-compiled), installs each one with pip on a runner of its
# own platform and decodes the test fixtures with it, then attaches the wheels and
# SHA256SUMS.txt to a draft release. Publishing the draft is a deliberate click.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: The tag matches the package version
        shell: bash
        run: |
          VERSION=$(python -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('heicreader/__init__.py').read(), re.M).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $VERSION"
            exit 1
          fi

      - name: Build the wheels
        run: python tools/build_wheels.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  verify:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist

      # pip picks the wheel for this platform out of the six; the check runs from outside
      # the checkout so it imports the installed package, not the source folder.
      - name: Install the wheel and decode the fixtures with it
        shell: bash
        run: |
          python -m pip install pillow
          python -m pip install --no-index --find-links dist heicreader
          cd "$RUNNER_TEMP"
          python -I - "$GITHUB_WORKSPACE/tests/data" <<'PY'
          import sys, heicreader
          from PIL import Image
          data = sys.argv[1]
          assert 'site-packages' in heicreader.__file__, heicreader.__file__
          print(heicreader.binary_path(), heicreader.helper_version())
          image = heicreader.to_pil(f'{data}/grid_alpha.heic')
          assert (image.mode, image.size) == ('RGBA', (1100, 700)), (image.mode, image.size)
          assert image.getpixel((150, 20))[3] <= 5 and image.getpixel((550, 350))[3] >= 250
          assert heicreader.decode(f'{data}/orientation.heic')[1:3] == (120, 200)
          tags = Image.Exif(); tags.load(heicreader.raw_exif(f'{data}/orientation.heic'))
          assert tags.get(274) == 6
          print('ok')
          PY

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "heicreader $GITHUB_REF_NAME" --generate-notes dist/*
