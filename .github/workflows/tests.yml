name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Go 1.26 builds for macOS 12 and newer; Go 1.27 raises that to macOS 13.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Build the helper for this machine
        run: python tools/build_wheels.py --local

      - name: Python tests
        run: |
          python -m pip install pillow
          python -W error::ResourceWarning -m unittest discover -s tests -v
